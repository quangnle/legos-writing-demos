<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Gradient Demo - Reinforcement Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Policy Gradient Demo</h1>
        <div class="map-info">
            <p><strong>Bản đồ 3x3:</strong></p>
            <pre>S--
-X-
--G</pre>
            <p>S(0,0) → G(2,2) | "-" = -1 điểm | "X" = -5 điểm | Max steps = 20</p>
        </div>
        
        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(0)">R(τ) nguyên mẫu</button>
            <button class="tab-btn" onclick="switchTab(1)">G_t</button>
            <button class="tab-btn" onclick="switchTab(2)">Có baseline</button>
        </div>
        
        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Tab 1: R(τ) -->
            <div class="tab-panel active" id="tab-0">
                <div class="method-header">
                    <h2>Phương pháp R(τ) nguyên mẫu</h2>
                    <div class="episode-counter" id="episode-0">Episode: 0</div>
                </div>
                <button class="train-btn" onclick="trainEpisode(0)">Train 1 episode</button>
                <div class="content-grid">
                    <div class="left-panel">
                        <div class="trajectories-container" id="trajectories-0"></div>
                        <div class="visualization-container" id="viz-0"></div>
                    </div>
                    <div class="right-panel">
                        <textarea class="calculation-area" id="calc-0" readonly></textarea>
                    </div>
                </div>
            </div>
            
            <!-- Tab 2: G_t -->
            <div class="tab-panel" id="tab-1">
                <div class="method-header">
                    <h2>Phương pháp G_t</h2>
                    <div class="episode-counter" id="episode-1">Episode: 0</div>
                </div>
                <button class="train-btn" onclick="trainEpisode(1)">Train 1 episode</button>
                <div class="content-grid">
                    <div class="left-panel">
                        <div class="trajectories-container" id="trajectories-1"></div>
                        <div class="visualization-container" id="viz-1"></div>
                    </div>
                    <div class="right-panel">
                        <textarea class="calculation-area" id="calc-1" readonly></textarea>
                    </div>
                </div>
            </div>
            
            <!-- Tab 3: Baseline -->
            <div class="tab-panel" id="tab-2">
                <div class="method-header">
                    <h2>Phương pháp có baseline</h2>
                    <div class="episode-counter" id="episode-2">Episode: 0</div>
                </div>
                <button class="train-btn" onclick="trainEpisode(2)">Train 1 episode</button>
                <div class="content-grid">
                    <div class="left-panel">
                        <div class="trajectories-container" id="trajectories-2"></div>
                        <div class="visualization-container" id="viz-2"></div>
                    </div>
                    <div class="right-panel">
                        <textarea class="calculation-area" id="calc-2" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="theta-display">
            <h3>Theta hiện tại:</h3>
            <div id="theta-display"></div>
        </div>

        <footer>
            &copy; 2026 Policy Gradient Demo - Legos Writing Demos
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
